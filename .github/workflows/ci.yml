name: Software verification
on:
  push:
    branches: [main]
    tags: ["v1.0.0-rc.*", "v1.0.0", "v1.0.1", "v1.0.2", "v1.0.3", "v1.0.4"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    # Standard hosted runners are free and unlimited for this public repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_USER: eigengrid_ci
          POSTGRES_DB: eigengrid_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:54339:5432
        options: >-
          --memory 1g --memory-swap 1g --pids-limit 256
          --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,size=512m,mode=0700
          --health-cmd "pg_isready -U eigengrid_ci -d eigengrid_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      EIGENGRID_TEST_POSTGRES_URL: postgresql://eigengrid_ci@127.0.0.1:54339/eigengrid_ci
      EIGENGRID_TEST_CONTAINER_RUNTIME: docker
      EIGENGRID_TEST_MD_IMAGE: docker.io/library/python@sha256:1aaa65a85fda306ffb8b910824d4e93bdce61e212c7e87168123ea3073b41a1a
      EIGENGRID_CI_EXTENDED_TIMEOUTS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce public distribution policy
        run: python3 scripts/release/scan.py --public .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          python -m pip install --require-hashes -r python/requirements-linux-x64-py313.lock
          python -m pip install --no-deps --no-build-isolation -e ./python
      - name: Commit policy
        run: |
          node --test scripts/check-commits.test.mjs
          node scripts/check-commits.mjs
      - name: Dependency security regressions and advisory review
        run: |
          bun test tests/ts/dependency-security.test.ts
          # A tracked Bun patch backports collection size gates without changing
          # v3 scientific schema/digest contracts; the regression above is required.
          bun audit --ignore GHSA-mrhx-c7xc-m3w5
      - name: Static quality
        run: |
          bun run typecheck
          bun run lint
          bun run format:check
      - name: Native build and installed tool execution
        run: |
          bun run build
          bun run build:native
          bun run verify:distribution
      - name: Reproducible release package
        run: |
          node scripts/release/package.mjs dist/native dist/packages
          node scripts/release/package.mjs dist/native dist/packages-repeat
          cmp dist/packages/SHA256SUMS dist/packages-repeat/SHA256SUMS
          cmp dist/packages/release.json dist/packages-repeat/release.json
          cmp dist/packages/*.tar.gz dist/packages-repeat/*.tar.gz
      - name: Prepare protected integration fixture
        run: |
          docker pull "$EIGENGRID_TEST_MD_IMAGE"
          chmod -R a+rX "$GITHUB_WORKSPACE"
          chmod a+rx "$(command -v bun)"
      - name: Complete TypeScript suite with disposable PostgreSQL
        run: |
          umask 0022
          bun run test:ts
      - name: Python regressions
        run: |
          PYTEST_ADDOPTS="--basetemp=${TMPDIR:-$RUNNER_TEMP}/p" bun run test:py
      - name: Distribution hygiene
        run: python scripts/release/scan.py .
      - name: Prepare validated release
        if: (startsWith(github.ref, 'refs/tags/v1.0.0-rc.') || github.ref == 'refs/tags/v1.0.0' || github.ref == 'refs/tags/v1.0.1' || github.ref == 'refs/tags/v1.0.2' || github.ref == 'refs/tags/v1.0.3' || github.ref == 'refs/tags/v1.0.4')
        run: bun scripts/release/validation.ts
      - uses: actions/upload-artifact@v4
        if: (startsWith(github.ref, 'refs/tags/v1.0.0-rc.') || github.ref == 'refs/tags/v1.0.0' || github.ref == 'refs/tags/v1.0.1' || github.ref == 'refs/tags/v1.0.2' || github.ref == 'refs/tags/v1.0.3' || github.ref == 'refs/tags/v1.0.4')
        with:
          name: validated-release
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish validated release
    needs: verify
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v1.0.0-rc.') || github.ref == 'refs/tags/v1.0.0' || github.ref == 'refs/tags/v1.0.1' || github.ref == 'refs/tags/v1.0.2' || github.ref == 'refs/tags/v1.0.3' || github.ref == 'refs/tags/v1.0.4')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-release
          path: release
      - uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const tag = process.env.RELEASE_TAG;
            const validation = JSON.parse(fs.readFileSync('release/validation.json'));
            const manifest = JSON.parse(fs.readFileSync('release/release.json'));
            if (!/^v1\.0\.(?:0(?:-rc\.[1-9]\d*)?|[1234])$/u.test(tag) ||
                tag !== tag.trim() || tag !== `v${manifest.version}` || validation.tag !== tag ||
                validation.sourceCommit !== process.env.RELEASE_COMMIT ||
                manifest.sourceCommit !== process.env.RELEASE_COMMIT ||
                validation.runId !== context.runId) {
              throw new Error('Release identity mismatch');
            }
            for (const [name, expected] of [
              [validation.archive, validation.archiveSha256],
              ['release.json', validation.manifestSha256],
            ]) {
              if (name.includes('/') || name.includes('..') ||
                  crypto.createHash('sha256').update(fs.readFileSync(`release/${name}`)).digest('hex') !== expected) {
                throw new Error('Release asset integrity mismatch');
              }
            }
            const notes = fs.readFileSync(`docs/release-notes/${tag}.md`, 'utf8').trim();
            if (!notes) throw new Error('Release notes must not be empty');
            const created = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: process.env.RELEASE_COMMIT,
              name: `EigenGrid ${tag}`, draft: true, prerelease: tag.includes('-rc.'),
              body: `${notes}\n\nSource commit: \`${process.env.RELEASE_COMMIT}\`.\n\n[GitHub-hosted verification](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });
            for (const name of [validation.archive, 'release.json', 'SHA256SUMS', 'validation.json']) {
              const data = fs.readFileSync(`release/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: created.data.id, name,
                data, headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              });
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: created.data.id, draft: false,
            });

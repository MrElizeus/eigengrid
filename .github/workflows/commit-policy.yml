name: Commit policy
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  commits:
    name: Conventional commits
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !github.event.repository.private
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "eigengrid-ci-rootless"]') || fromJSON('["ubuntu-24.04"]') }}
    # The private runner can wait up to one hour for the shared job slot.
    timeout-minutes: ${{ github.event.repository.private && 90 || 5 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify private runner isolation
        if: github.event.repository.private
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if sudo -n true >/dev/null 2>&1; then exit 1; fi
          test "$DOCKER_HOST" = "unix:///run/user/$(id -u)/docker.sock"
          docker info --format '{{json .SecurityOptions}}' | grep -q rootless
          scratch="${EIGENGRID_CI_SCRATCH:?A private CI scratch mount is required}"
          test ! -L "$scratch"
          test "$(findmnt -n -o FSTYPE -M "$scratch")" = tmpfs
          test "$(stat -c %u "$scratch")" = "$(id -u)"
          fixtures="$(mktemp -d "$scratch/job.XXXXXXXX")"
          echo "TMPDIR=$fixtures" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test commit policy
        run: node --test scripts/check-commits.test.mjs
      - name: Check new commits and pull request title
        run: node scripts/check-commits.mjs --ci
      - name: Remove private test fixtures
        if: always() && github.event.repository.private
        run: |
          if [[ -n "${TMPDIR:-}" && "$TMPDIR" == "${EIGENGRID_CI_SCRATCH:?}"/job.* && -d "$TMPDIR" ]]; then
            test ! -L "$TMPDIR"
            test "$(stat -c %u "$TMPDIR")" = "$(id -u)"
            chmod -R u+rwX "$TMPDIR"
            find "$TMPDIR" -xdev -mindepth 1 -delete
            rmdir "$TMPDIR"
          fi

name: Commit policy
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  commits:
    name: Conventional commits
    # Standard hosted runners are free and unlimited for this public repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test commit policy
        run: node --test scripts/check-commits.test.mjs
      - name: Check new commits and pull request title
        run: node scripts/check-commits.mjs --ci

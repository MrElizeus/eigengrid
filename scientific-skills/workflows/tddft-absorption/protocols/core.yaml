{
  "schema": "eigengrid.protocol-fragment/v1",
  "id": "workflows.tddft-absorption.plan",
  "version": "1.0.0",
  "capability": "workflows.tddft-absorption",
  "required_inputs": [
    "Ground-state geometry or weighted ensemble, electronic state and converged reference orbitals",
    "Target energy or wavelength interval, units, spin manifold and desired resolution",
    "Functional, basis, response approximation and solvent/environment response appropriate to vertical excitation"
  ],
  "missing_input_behavior": "block",
  "steps": [
    {
      "id": "fix-spectrum",
      "kind": "planning",
      "reason": "Define absorption, spin manifold, vertical geometries, medium and target energy window. Confirm a stable SCF reference. Keep thermal conformer weights separate from oscillator strengths."
    },
    {
      "id": "cover-window",
      "kind": "planning",
      "reason": "Request and converge enough roots in the chosen manifold to cover the upper energy boundary with margin. Increase the root count until relevant centers and intensities stop changing within a declared tolerance."
    },
    {
      "id": "inspect-character",
      "kind": "validation",
      "reason": "For each target root record energy, oscillator strength with its gauge, NTO hole/particle pairs and weights or other transition-density evidence. Distinguish local, interfragment charge transfer and diffuse states. Compare states by character rather than by root number."
    },
    {
      "id": "stress-test",
      "kind": "validation",
      "reason": "Test basis diffuseness for Rydberg or anionic targets and range separation for long-range transfer. If changing model reverses state assignment or plausible double excitations dominate, retain competing assignments and seek independent evidence."
    },
    {
      "id": "archive-spectrum",
      "kind": "provenance",
      "reason": "Retain the unshifted per-conformer stick spectrum in eV and oscillator strengths. Convert using wavelength = hc / energy with consistent units. Report ensemble weights and any visualization broadening separately from the electronic roots."
    }
  ],
  "acceptance": [
    "All target roots have solver convergence, covered energy range and state-character evidence.",
    "A proposed bright band has finite intensity in the specified model and an assignment that survives the declared sensitivity checks, or is labeled ambiguous.",
    "Raw roots, units and oscillator strengths remain traceable after broadening or averaging."
  ],
  "retry_policy": {
    "maximum_attempts": 1,
    "material_change": "new_decision_and_exact_approval"
  },
  "effect_authority": "none"
}

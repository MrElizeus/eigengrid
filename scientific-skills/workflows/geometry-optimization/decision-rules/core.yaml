{
  "schema": "eigengrid.decision-rule/v1",
  "id": "workflows.geometry-optimization.core",
  "version": "1.0.0",
  "question": "Does the optimization preserve the approved scientific model and have a verifiable stopping criterion?",
  "when":
    {
      "all":
        [
          { "fact": "inputs.complete", "operator": "equals", "value": true },
          { "fact": "applicability.confirmed", "operator": "equals", "value": true },
        ],
    },
  "recommendation":
    {
      "action": "plan optimization, artifact collection, parsing, and a separate frequency validation step",
      "strength": "conditional",
    },
  "rationale": "A normal optimizer exit is operational evidence, not sufficient scientific validation.",
  "risk_class": 2,
  "approval": "required_if_material_field_changes",
  "immutable_fields": ["objective", "charge", "multiplicity", "method", "basis", "physical_model"],
  "evidence": { "level": "draft", "references": [] },
  "limitations": "Optimizer convergence alone does not establish a minimum. Escalate chemically implausible structures, state changes, fragmentation, or any proposed model change.",
}

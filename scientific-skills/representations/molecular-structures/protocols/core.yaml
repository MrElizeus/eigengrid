{
  "schema": "eigengrid.protocol-fragment/v1",
  "id": "representations.molecular-structures.validate-structure-evidence",
  "version": "1.0.0",
  "capability": "representations.molecular-structures",
  "required_inputs":
    [
      "structure evidence reference",
      "declared structure format",
      "atom identities and coordinates",
    ],
  "missing_input_behavior": "block",
  "steps":
    [
      {
        "id": "verify-inputs",
        "kind": "validation",
        "reason": "Fail closed before planning from incomplete or mismatched evidence.",
      },
      {
        "id": "validate-structure-evidence",
        "kind": "planning",
        "reason": "A calculation cannot be attributed if the molecular system is not immutable and unambiguous.",
      },
      {
        "id": "record-evidence",
        "kind": "provenance",
        "reason": "Persist exact skill, fragment, input, output, and decision references.",
      },
    ],
  "acceptance":
    [
      "artifact digest is recorded",
      "atom identities and finite coordinates parse",
      "declared and parsed atom counts agree",
    ],
  "retry_policy": { "maximum_attempts": 1, "material_change": "new_decision_and_exact_approval" },
  "effect_authority": "none",
}

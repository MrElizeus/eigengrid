{
  "schema": "eigengrid.decision-rule/v1",
  "id": "validation.uncertainty-assessment.core",
  "version": "1.0.0",
  "question": "Is the claimed confidence supported by the available evidence and applicability domain?",
  "when":
    {
      "all":
        [
          { "fact": "inputs.complete", "operator": "equals", "value": true },
          { "fact": "applicability.confirmed", "operator": "equals", "value": true },
        ],
    },
  "recommendation":
    {
      "action": "separate numerical, model, structural, and interpretation uncertainty and constrain the final claim",
      "strength": "conditional",
    },
  "rationale": "Reported digits and converged jobs do not establish scientific accuracy.",
  "risk_class": 2,
  "approval": "required_if_material_field_changes",
  "immutable_fields": ["objective", "charge", "multiplicity", "method", "basis", "physical_model"],
  "evidence": { "level": "draft", "references": [] },
  "limitations": "This draft structures uncertainty but supplies no benchmark-derived error bars. Escalate quantitative accuracy claims and out-of-domain extrapolation.",
}

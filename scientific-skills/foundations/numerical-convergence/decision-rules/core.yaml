{
  "schema": "eigengrid.decision-rule/v1",
  "id": "foundations.numerical-convergence.core",
  "version": "1.0.0",
  "question": "Is a proposed remediation numerically bounded or scientifically material?",
  "when":
    {
      "all":
        [
          { "fact": "inputs.complete", "operator": "equals", "value": true },
          { "fact": "applicability.confirmed", "operator": "equals", "value": true },
        ],
    },
  "recommendation":
    {
      "action": "permit only policy-bounded controls that preserve the approved scientific model; require approval for material changes",
      "strength": "conditional",
    },
  "rationale": "Numerical remediation may improve solution of the same equations but must not become an unrecorded model change.",
  "risk_class": 2,
  "approval": "required_if_material_field_changes",
  "immutable_fields": ["objective", "charge", "multiplicity", "method", "basis", "physical_model"],
  "evidence": { "level": "draft", "references": [] },
  "limitations": "Tighter thresholds do not correct a scientifically unsuitable model. Escalate changes that alter charge, multiplicity, method, basis, physical model, or objective.",
}
